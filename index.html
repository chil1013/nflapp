<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProGrid Live - NFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar for sleeker mobile feel */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 3px; width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

        /* Prevent pull-to-refresh jarring on mobile app shells */
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200 pb-24 antialiased">

    <!-- Header / Centered Mobile-First Top Bar -->

        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col items-center gap-2.5">
            
            <!-- Centered Branding -->
            <div class="flex items-center justify-center space-x-2">

                <span class="text-[10px] font-black bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full uppercase tracking-widest shadow-[0_0_10px_rgba(99,102,241,0.1)]">NFL</span>
            </div>

            <!-- Centered Controls: Favorite Team & Week Selector -->
            <div class="flex items-center justify-center gap-2 w-full max-w-sm">
                <!-- Favorite Team Selector Dropdown -->
                <select id="fav-team-selector" onchange="changeFavoriteTeam(this.value)" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs font-semibold text-amber-400 rounded-lg px-2.5 py-2 outline-none focus:border-cyan-500 cursor-pointer appearance-none text-center">
                    <option value="">⭐ Fav Team...</option>
                    <option value="Arizona Cardinals">Arizona Cardinals</option>
                    <option value="Atlanta Falcons">Atlanta Falcons</option>
                    <option value="Baltimore Ravens">Baltimore Ravens</option>
                    <option value="Buffalo Bills">Buffalo Bills</option>
                    <option value="Carolina Panthers">Carolina Panthers</option>
                    <option value="Chicago Bears">Chicago Bears</option>
                    <option value="Cincinnati Bengals">Cincinnati Bengals</option>
                    <option value="Cleveland Browns">Cleveland Browns</option>
                    <option value="Dallas Cowboys">Dallas Cowboys</option>
                    <option value="Denver Broncos">Denver Broncos</option>
                    <option value="Detroit Lions">Detroit Lions</option>
                    <option value="Green Bay Packers">Green Bay Packers</option>
                    <option value="Houston Texans">Houston Texans</option>
                    <option value="Indianapolis Colts">Indianapolis Colts</option>
                    <option value="Jacksonville Jaguars">Jacksonville Jaguars</option>
                    <option value="Kansas City Chiefs">Kansas City Chiefs</option>
                    <option value="Las Vegas Raiders">Las Vegas Raiders</option>
                    <option value="Los Angeles Chargers">Los Angeles Chargers</option>
                    <option value="Los Angeles Rams">Los Angeles Rams</option>
                    <option value="Miami Dolphins">Miami Dolphins</option>
                    <option value="Minnesota Vikings">Minnesota Vikings</option>
                    <option value="New England Patriots">New England Patriots</option>
                    <option value="New Orleans Saints">New Orleans Saints</option>
                    <option value="New York Giants">New York Giants</option>
                    <option value="New York Jets">New York Jets</option>
                    <option value="Philadelphia Eagles">Philadelphia Eagles</option>
                    <option value="Pittsburgh Steelers">Pittsburgh Steelers</option>
                    <option value="San Francisco 49ers">San Francisco 49ers</option>
                    <option value="Seattle Seahawks">Seattle Seahawks</option>
                    <option value="Tampa Bay Buccaneers">Tampa Bay Buccaneers</option>
                    <option value="Tennessee Titans">Tennessee Titans</option>
                    <option value="Washington Commanders">Washington Commanders</option>
                </select>

                <!-- Week Selector Dropdown -->
                <select id="week-selector" onchange="changeWeek(this.value)" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs font-semibold text-zinc-300 rounded-lg px-2.5 py-2 outline-none focus:border-indigo-500 cursor-pointer appearance-none text-center">
                    <option value="">Current Week</option>

            </div>
        </div>
    </header>

    <!-- Main Content Container (SPA Router) -->
    <main class="max-w-4xl mx-auto px-3 mt-4">
        
        <!-- PAGE 1: SCORES -->
        <div id="page-scores" class="page-section">
            <div id="scoreboard" class="grid grid-cols-1 gap-3">
                <p class="text-zinc-600 font-medium col-span-full text-center py-12 animate-pulse text-xs uppercase tracking-widest">Establishing connection...</p>
            </div>
        </div>

        <!-- PAGE 2: STANDINGS -->
        <div id="page-standings" class="page-section hidden">
            <!-- Standings Sub-Navigation -->
            <div class="flex justify-center mb-4">
                <div class="bg-zinc-900/90 backdrop-blur-sm border border-zinc-800 rounded-xl p-1 flex gap-1 shadow-lg w-full">
                    <button onclick="setStandingsView('division')" id="st-tab-division" class="flex-1 py-2 text-[11px] font-black uppercase tracking-wider rounded-lg transition-all bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 cursor-pointer text-center">Division</button>
                    <button onclick="setStandingsView('conference')" id="st-tab-conference" class="flex-1 py-2 text-[11px] font-black uppercase tracking-wider rounded-lg transition-all text-zinc-500 hover:text-zinc-300 border border-transparent cursor-pointer text-center">Conference</button>
                    <button onclick="setStandingsView('playoff')" id="st-tab-playoff" class="flex-1 py-2 text-[11px] font-black uppercase tracking-wider rounded-lg transition-all text-zinc-500 hover:text-zinc-300 border border-transparent cursor-pointer text-center">Playoff</button>
                </div>
            </div>

            <!-- Dynamic Standings Content -->
            <div id="standings-content"></div>
        </div>

    </main>

    <!-- Bottom App Shell Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-900 z-30 px-6 py-2 flex justify-around items-center shadow-[0_-10px_25px_rgba(0,0,0,0.8)]">
        <button onclick="switchPage('scores')" id="tab-scores" class="nav-tab flex flex-col items-center gap-1 py-1 text-cyan-400 transition-colors cursor-pointer">
            <span class="text-lg leading-none">🏈</span>
            <span class="text-[10px] font-black tracking-widest uppercase">Scores</span>
        </button>
        <button onclick="switchPage('standings')" id="tab-standings" class="nav-tab flex flex-col items-center gap-1 py-1 text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer">
            <span class="text-lg leading-none">📊</span>
            <span class="text-[10px] font-black tracking-widest uppercase">Standings</span>
        </button>
    </nav>

    <!-- Bottom Footer Sync Status Bar -->
    <footer class="fixed bottom-[56px] left-0 right-0 bg-zinc-950/80 backdrop-blur-md border-t border-zinc-900/50 py-1.5 px-4 text-center z-20 pointer-events-none">
        <span id="last-updated" class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">Syncing live data...</span>
    </footer>

    <!-- Game Center Box (Modal) -->
    <div id="gamecast-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex flex-col items-center justify-end sm:justify-center sm:p-4">
        <div class="bg-zinc-950 sm:bg-zinc-900 sm:border border-zinc-800 w-full max-w-2xl h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-2xl overflow-y-auto shadow-2xl flex flex-col relative">
            
            <!-- Mobile pull-indicator -->
            <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mt-3 sm:hidden"></div>

            <div class="p-4 flex justify-between items-center sticky top-0 bg-zinc-950 sm:bg-zinc-900 z-50 backdrop-blur-xl border-b border-zinc-800/50">
                <h3 id="modal-header-title" class="font-black tracking-widest text-sm bg-gradient-to-r from-zinc-100 to-zinc-400 bg-clip-text text-transparent uppercase">Game Center</h3>
                <button onclick="closeGamecast()" class="text-zinc-400 hover:text-white bg-zinc-900 p-2 rounded-full h-8 w-8 flex items-center justify-center cursor-pointer transition-colors">✕</button>
            </div>
            
            <div id="modal-content" class="p-4 space-y-5 pb-16 relative z-10">
                <div class="text-center py-20 text-zinc-600 font-medium animate-pulse flex flex-col items-center gap-3">
                    <svg class="w-8 h-8 animate-spin text-cyan-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Syncing Live Data...
                </div>
            </div>
        </div>
    </div>

    <script>
        const endpoint = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';

        let cachedEvents = [];
        let favoriteTeam = localStorage.getItem('proscore_fav_nfl_team') || 'Pittsburgh Steelers';
        
        let isInitialLoad = true;
        let selectedSeasonType = '';
        let selectedWeek = '';
        let currentActiveSeasonType = '2';
        let currentActiveWeekNumber = 1;
        let globalBoxscoreData = null;
        let currentPage = 'scores';

        if (favoriteTeam) {
            const selectEl = document.getElementById('fav-team-selector');
            if (selectEl) selectEl.value = favoriteTeam;
        }

        // ==========================================
        // SINGLE PAGE APP ROUTER
        // ==========================================
        function switchPage(pageId) {
            currentPage = pageId;
            
            // 1. Update Navigation Tabs UI
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('text-cyan-400');
                tab.classList.add('text-zinc-500');
            });
            const activeTab = document.getElementById(`tab-${pageId}`);
            if (activeTab) {
                activeTab.classList.remove('text-zinc-500');
                activeTab.classList.add('text-cyan-400');
            }

            // 2. Hide all pages, show target page
            document.querySelectorAll('.page-section').forEach(page => {
                page.classList.add('hidden');
            });
            document.getElementById(`page-${pageId}`).classList.remove('hidden');

            // 3. Trigger Data Loads
            if (pageId === 'scores' && cachedEvents.length === 0) fetchScoresForSelected();
            if (pageId === 'standings') loadStandings();
        }

        // ==========================================
        // MULTI-VIEW STANDINGS ENGINE
        // ==========================================
        let currentStandingsView = 'division';

        function setStandingsView(view) {
            const contentDiv = document.getElementById('standings-content');
            if (currentStandingsView === view && contentDiv.dataset.loaded === view) return;
            
            currentStandingsView = view;
            
            ['division', 'conference', 'playoff'].forEach(tab => {
                const el = document.getElementById(`st-tab-${tab}`);
                if (tab === view) {
                    el.className = "flex-1 py-2 text-[11px] font-black uppercase tracking-wider rounded-lg transition-all bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 cursor-pointer shadow-inner text-center";
                } else {
                    el.className = "flex-1 py-2 text-[11px] font-black uppercase tracking-wider rounded-lg transition-all text-zinc-500 hover:text-zinc-300 border border-transparent cursor-pointer text-center";
                }
            });

            loadStandings(true);
        }

        async function loadStandings(force = false) {
            const contentDiv = document.getElementById('standings-content');
            
            if (!force && contentDiv.dataset.loaded === currentStandingsView) return;

            contentDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 text-cyan-500/70 animate-pulse">
                    <svg class="w-8 h-8 animate-spin mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="font-medium tracking-widest text-[11px] uppercase">Compiling ${currentStandingsView}...</p>
                </div>`;

            try {
                let type = 0;
                let level = 3;
                if (currentStandingsView === 'conference') { type = 0; level = 2; }
                if (currentStandingsView === 'playoff') { type = 1; level = 2; }

                let isFuture = false;
                if (selectedSeasonType && currentActiveSeasonType) {
                    const selST = parseInt(selectedSeasonType, 10);
                    const actST = parseInt(currentActiveSeasonType, 10);
                    if (selST > actST) {
                        isFuture = true;
                    } else if (selST === actST && selectedWeek && currentActiveWeekNumber) {
                        if (parseInt(selectedWeek, 10) > currentActiveWeekNumber) {
                            isFuture = true;
                        }
                    }
                }

                let activeSeasonType = (isFuture || !selectedSeasonType) ? currentActiveSeasonType : selectedSeasonType;
                activeSeasonType = activeSeasonType || '2';

                const targetUrl = `https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?region=us&lang=en&contentorigin=espn&seasontype=${activeSeasonType}&type=${type}&level=${level}`;
                const data = await fetchSafe(targetUrl);
                
                if (!data || !data.children) throw new Error("Invalid API Data Structure");

                let html = '<div class="space-y-4 pb-4">';

                data.children.forEach(conference => {
                    html += `
                        <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-3 sm:p-5 shadow-inner">
                            <h3 class="text-sm font-black uppercase tracking-widest text-cyan-400 mb-4 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.8)]"></span> ${conference.name}
                            </h3>
                    `;

                    if (currentStandingsView === 'division') {
                        conference.children.forEach(division => {
                            html += buildStandingsTable(division.name, division.standings.entries, false);
                        });
                    } else {
                        if (conference.standings && conference.standings.entries) {
                            let title = currentStandingsView === 'playoff' ? `${conference.name} Playoff Picture` : `${conference.name} Rank`;
                            html += buildStandingsTable(title, conference.standings.entries, currentStandingsView === 'playoff');
                        }
                    }
                    
                    html += `</div>`;
                });

                html += '</div>';
                contentDiv.innerHTML = html;
                contentDiv.dataset.loaded = currentStandingsView;

            } catch (err) {
                console.error("Standings fetch failed:", err);
                contentDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 bg-zinc-900/30 rounded-2xl border border-dashed border-zinc-800">
                        <span class="text-3xl mb-3">⚠️</span>
                        <p class="uppercase tracking-widest text-xs font-black text-red-400">Connection Error</p>
                        <p class="text-[11px] text-zinc-500 mt-1 text-center px-4">Unable to fetch live standings data right now.</p>
                        <button onclick="loadStandings(true)" class="mt-4 px-3 py-1.5 bg-zinc-800 text-[11px] font-bold text-white rounded-lg cursor-pointer">Retry</button>
                    </div>`;
            }
        }

        function buildStandingsTable(title, entries, isPlayoffView) {
            let html = `
                <div class="mb-6 last:mb-0">
                    <h4 class="text-[11px] font-black uppercase tracking-widest text-zinc-400 mb-2.5 border-b border-zinc-800/80 pb-1.5 flex justify-between items-center">
                        <span>${title}</span>
                        ${isPlayoffView ? '<span class="text-[8px] text-zinc-500 bg-zinc-900 px-1.5 py-0.5 rounded border border-zinc-800">TOP 7 CLINCH</span>' : ''}
                    </h4>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-xs whitespace-nowrap">
                            <thead>
                                <tr class="text-zinc-600 text-[9px] uppercase tracking-widest bg-zinc-950/40">
                                    <th class="py-2 px-2 font-bold w-full rounded-l">${isPlayoffView ? 'Seed & Team' : 'Team'}</th>
                                    <th class="py-2 px-2 font-bold text-center">W</th>
                                    <th class="py-2 px-2 font-bold text-center">L</th>
                                    <th class="py-2 px-2 font-bold text-center">T</th>
                                    <th class="py-2 px-2 font-bold text-center rounded-r">PCT</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-zinc-800/30">
            `;

            entries.forEach((entry, idx) => {
                const team = entry.team;
                const stats = entry.stats;
                
                const getStat = (abbr) => {
                    if (!stats || !Array.isArray(stats)) return '-';
                    const statMapping = {
                        'W': ['wins', 'w', 'win'],
                        'L': ['losses', 'l', 'loss'],
                        'T': ['ties', 't', 'tie'],
                        'PCT': ['winpercent', 'pct', 'percentage']
                    };
                    const targets = statMapping[abbr] || [abbr.toLowerCase()];
                    const stat = stats.find(s => {
                        const sName = (s.name || '').toLowerCase();
                        const sAbbr = (s.abbreviation || '').toLowerCase();
                        const sType = (s.type || '').toLowerCase();
                        return targets.includes(sName) || targets.includes(sAbbr) || targets.includes(sType);
                    });
                    if (stat) {
                        if (stat.displayValue !== undefined && stat.displayValue !== null) return stat.displayValue;
                        if (stat.value !== undefined && stat.value !== null) {
                            if (abbr === 'PCT' && !isNaN(stat.value)) return stat.value.toFixed(3).replace(/^0/, '');
                            return stat.value.toString();
                        }
                    }
                    return '-';
                };

                let rowClasses = "hover:bg-zinc-800/40 transition-colors group";
                let seedBadge = '';

                if (isPlayoffView) {
                    const seed = idx + 1;
                    if (seed <= 7) {
                        seedBadge = `<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 w-4 h-4 flex items-center justify-center rounded text-[9px] font-black mr-2 shrink-0">${seed}</span>`;
                    } else {
                        seedBadge = `<span class="bg-zinc-900/50 text-zinc-600 border border-zinc-800/50 w-4 h-4 flex items-center justify-center rounded text-[9px] font-black mr-2 shrink-0">${seed}</span>`;
                        rowClasses += " opacity-50 hover:opacity-100"; 
                    }
                }

                html += `
                    <tr class="${rowClasses}">
                        <td class="py-2 px-2 flex items-center">
                            ${seedBadge}
                            <div class="w-6 h-6 rounded-full bg-zinc-950 p-0.5 border border-zinc-700/50 flex items-center justify-center shrink-0 mr-2">
                                <img src="${team.logos?.[0]?.href || ''}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                            </div>
                            <span class="font-bold text-xs text-zinc-200 group-hover:text-cyan-400 transition-colors truncate max-w-[130px] sm:max-w-none">${team.displayName}</span>
                        </td>
                        <td class="py-2 px-2 text-center text-zinc-300 font-mono text-xs">${getStat('W')}</td>
                        <td class="py-2 px-2 text-center text-zinc-300 font-mono text-xs">${getStat('L')}</td>
                        <td class="py-2 px-2 text-center text-zinc-500 font-mono text-xs">${getStat('T')}</td>
                        <td class="py-2 px-2 text-center text-cyan-400 font-mono text-xs font-medium">${getStat('PCT')}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            return html;
        }

        // ==========================================
        // SMART COLOR ENGINE
        // ==========================================
        function hexToRgb(hex) {
            if (!hex) return {r:0,g:0,b:0};
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
            return {
                r: parseInt(hex.substring(0,2), 16),
                g: parseInt(hex.substring(2,4), 16),
                b: parseInt(hex.substring(4,6), 16)
            };
        }

        function getLuminance(hex) {
            let c = hexToRgb(hex);
            return (0.299 * c.r + 0.587 * c.g + 0.114 * c.b);
        }

        function isColorReadable(hex) {
            if (!hex) return false;
            return getLuminance(hex) >= 40; 
        }

        function colorsClash(hex1, hex2) {
            let c1 = hexToRgb(hex1);
            let c2 = hexToRgb(hex2);
            let distance = Math.sqrt(Math.pow(c1.r - c2.r, 2) + Math.pow(c1.g - c2.g, 2) + Math.pow(c1.b - c2.b, 2));
            return distance < 80; 
        }

        function resolveMatchupColors(awayTeam, homeTeam) {
            let awayPrimary = awayTeam?.color ? '#' + awayTeam.color : null;
            let awayAlt = awayTeam?.alternateColor ? '#' + awayTeam.alternateColor : null;
            let homePrimary = homeTeam?.color ? '#' + homeTeam.color : null;
            let homeAlt = homeTeam?.alternateColor ? '#' + homeTeam.alternateColor : null;

            let getReadable = (p, a, fallback) => {
                let options = [];
                if (p && isColorReadable(p)) options.push(p);
                if (a && isColorReadable(a) && a !== p) options.push(a);
                if (options.length === 0) {
                    if (a && isColorReadable(a)) options.push(a); 
                    else options.push(fallback); 
                }
                return options;
            };

            let awayOptions = getReadable(awayPrimary, awayAlt, '#0ea5e9'); 
            let homeOptions = getReadable(homePrimary, homeAlt, '#6366f1'); 
            let finalAway = awayOptions[0];
            let finalHome = homeOptions[0];

            if (colorsClash(finalAway, finalHome)) {
                if (awayOptions.length > 1 && !colorsClash(awayOptions[1], finalHome)) {
                    finalAway = awayOptions[1];
                } else if (homeOptions.length > 1 && !colorsClash(finalAway, homeOptions[1])) {
                    finalHome = homeOptions[1];
                } else {
                    finalHome = '#e4e4e7'; 
                }
            }
            return { awayColor: finalAway, homeColor: finalHome };
        }

        async function fetchWithTimeout(url, timeout = 10000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchSafe(url) {
            const attempts = [
                () => fetchWithTimeout(url),
                () => fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`),
                () => fetchWithTimeout(`https://corsproxy.io/?url=${encodeURIComponent(url)}`)
            ];
            let lastError;
            for (const attempt of attempts) {
                try { return await attempt(); } catch (err) { lastError = err; }
            }
            throw lastError || new Error('Data unavailable');
        }

        function updateActiveSeasonInfo(data) {
            if (data.season && data.season.type) {
                currentActiveSeasonType = data.season.type.toString();
            } else if (data.leagues?.[0]?.season?.type) {
                currentActiveSeasonType = data.leagues[0].season.type.toString();
            }
            if (data.week && data.week.number) {
                currentActiveWeekNumber = parseInt(data.week.number, 10);
            } else if (data.leagues?.[0]?.season?.week) {
                currentActiveWeekNumber = parseInt(data.leagues[0].season.week, 10);
            }
        }

        async function loadCalendarAndScores() {
            const scoreboardContainer = document.getElementById('scoreboard');
            const weekSelector = document.getElementById('week-selector');

            if (isInitialLoad) {
                scoreboardContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 animate-pulse text-cyan-500/70">
                        <svg class="w-8 h-8 animate-spin mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <p class="font-medium text-[11px] tracking-widest uppercase">Syncing Schedule...</p>
                    </div>`;
            }

            try {
                const data = await fetchSafe(endpoint);
                updateActiveSeasonInfo(data);

                if (data.leagues && data.leagues[0] && data.leagues[0].calendar) {
                    let optionsHTML = '<option value="">Current Week</option>';
                    const calendar = data.leagues[0].calendar;
                    
                    calendar.forEach(seasonPart => {
                        const sType = seasonPart.value;
                        if (seasonPart.entries) {
                            seasonPart.entries.forEach(week => {
                                let labelDisplay = week.label || week.alternateLabel || week.detail;
                                if (sType === '1' && !labelDisplay.toLowerCase().includes('preseason')) {
                                    labelDisplay = `Preseason ${labelDisplay}`;
                                } else if (sType === '2' && !labelDisplay.toLowerCase().includes('regular')) {
                                    labelDisplay = `Regular Season ${labelDisplay}`;
                                }
                                const valString = `${sType}|${week.value}`;
                                let isSelected = (selectedSeasonType === sType && selectedWeek === week.value) ? 'selected' : '';
                                optionsHTML += `<option value="${valString}" ${isSelected}>${labelDisplay}</option>`;
                            });
                        }
                    });
                    weekSelector.innerHTML = optionsHTML;
                }

                await fetchScoresForSelected();
                isInitialLoad = false;
            } catch (err) {
                if (isInitialLoad) {
                    scoreboardContainer.innerHTML = `
                        <div class="col-span-full flex flex-col items-center py-16 bg-zinc-900/50 rounded-2xl border border-zinc-800">
                            <span class="text-3xl mb-3">📡</span>

                            <button onclick="loadCalendarAndScores()" class="bg-zinc-800 text-white text-xs font-semibold px-4 py-2 rounded-xl cursor-pointer">Retry</button>
                        </div>`;
                    isInitialLoad = false;
                }
            }
        }

        async function changeWeek(valString) {
            if (valString) {
                const parts = valString.split('|');
                selectedSeasonType = parts[0];
                selectedWeek = parts[1];
            } else {
                selectedSeasonType = '';
                selectedWeek = '';
            }
            isInitialLoad = false;
            
            const contentDiv = document.getElementById('standings-content');
            if (contentDiv) contentDiv.dataset.loaded = '';

            if (currentPage === 'scores') {
                document.getElementById('scoreboard').innerHTML = `
                    <div class="col-span-full text-center py-16 text-cyan-500/70 font-medium animate-pulse uppercase tracking-widest text-xs">
                        Loading Games...
                    </div>`;
                await fetchScoresForSelected();
            } else if (currentPage === 'standings') {
                await loadStandings(true);
            }
        }

        function changeFavoriteTeam(teamName) {
            favoriteTeam = teamName;
            localStorage.setItem('proscore_fav_nfl_team', teamName);
            if (currentPage === 'scores') fetchScoresForSelected();
        }

        async function fetchScoresForSelected() {
            let targetUrl = endpoint;
            const params = new URLSearchParams();
            if (selectedSeasonType) params.append('seasontype', selectedSeasonType);
            if (selectedWeek) params.append('week', selectedWeek);

            const queryString = params.toString();
            if (queryString) targetUrl += `?${queryString}`;

            try {
                const data = await fetchSafe(targetUrl);
                updateActiveSeasonInfo(data);
                cachedEvents = data.events || [];
                await renderScoreboard();
                document.getElementById('last-updated').textContent = `Synced: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            } catch (err) {
                document.getElementById('scoreboard').innerHTML = `<p class="text-red-500 text-xs font-semibold col-span-full text-center py-12">Failed to load games.</p>`;
            }
        }

        function isFavoriteGame(game, favTeam) {
            if (!favTeam) return false;
            const comp = game.competitions[0];
            const home = comp.competitors.find(t => t.homeAway === 'home');
            const away = comp.competitors.find(t => t.homeAway === 'away');
            const homeNames = [home.team.displayName, home.team.name, home.team.shortDisplayName].filter(Boolean);
            const awayNames = [away.team.displayName, away.team.name, away.team.shortDisplayName].filter(Boolean);
            return homeNames.includes(favTeam) || awayNames.includes(favTeam);
        }

        function getRecordSummary(competitor) {
            if (!competitor.records || competitor.records.length === 0) return '';
            const totalRecord = competitor.records.find(r => r.type === 'total' || r.name === 'overall');
            return totalRecord?.summary || competitor.records[0]?.summary || '';
        }

        async function openGamecast(gameId) {
            const modal = document.getElementById('gamecast-modal');
            const content = document.getElementById('modal-content');
            const title = document.getElementById('modal-header-title');
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 text-cyan-500/70 animate-pulse">
                    <svg class="w-8 h-8 animate-spin mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="font-medium tracking-widest text-[11px] uppercase">Loading Game Data...</p>
                </div>`;
            
            try {
                let data;
                try {
                    data = await fetchSafe(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${gameId}`);
                } catch (apiErr) {
                    const cachedGame = cachedEvents.find(g => g.id === gameId);
                    if (!cachedGame) throw new Error("Game data unavailable");
                    data = {
                        header: { competitions: cachedGame.competitions },
                        scoringPlays: [],
                        leaders: [],
                        boxscore: { teams: [], players: [] },
                        predictor: null
                    };
                }

                globalBoxscoreData = data;
                const competition = data.header?.competitions?.[0];
                if (!competition) throw new Error("Invalid competition data structure");

                const competitors = competition.competitors || [];
                const home = competitors.find(t => t.homeAway === 'home') || {};
                const away = competitors.find(t => t.homeAway === 'away') || {};
                title.textContent = `${away.team?.abbreviation || 'AWAY'} @ ${home.team?.abbreviation || 'HOME'}`;

                renderGameModalContent(0);
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-red-400 text-xs font-bold">Failed to load game details</div>`;
            }
        }

        function generateComparisonBar(label, awayVal, homeVal, awayDisplay, homeDisplay, awayColor, homeColor) {
            let total = awayVal + homeVal;
            let awayPct = total > 0 ? (awayVal / total) * 100 : 50;
            let homePct = total > 0 ? (homeVal / total) * 100 : 50;

            return `
                <div class="mb-3">
                    <div class="flex justify-between items-end mb-1 px-1">
                        <div class="flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${awayColor};"></span>
                            <span class="font-mono text-[11px] font-black text-zinc-100">${awayDisplay}</span>
                        </div>
                        <span class="text-zinc-500 text-[9px] uppercase tracking-widest font-black">${label}</span>
                        <div class="flex items-center gap-1">
                            <span class="font-mono text-[11px] font-black text-zinc-100">${homeDisplay}</span>
                            <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${homeColor};"></span>
                        </div>
                    </div>
                    <div class="flex h-2.5 bg-zinc-950 rounded-full overflow-hidden border border-zinc-800/80 p-0.5">
                        <div class="h-full rounded-l-full transition-all duration-500" style="width: ${awayPct}%; background-color: ${awayColor};"></div>
                        <div class="w-1 bg-zinc-950 shrink-0"></div>
                        <div class="h-full rounded-r-full transition-all duration-500" style="width: ${homePct}%; background-color: ${homeColor};"></div>
                    </div>
                </div>
            `;
        }

        function renderGameModalContent(selectedTeamIndex) {
            const content = document.getElementById('modal-content');
            const data = globalBoxscoreData;
            if (!data) return;

            const competition = data.header?.competitions?.[0];
            if (!competition) return;

            const competitors = competition.competitors || [];
            const home = competitors.find(t => t.homeAway === 'home') || {};
            const away = competitors.find(t => t.homeAway === 'away') || {};
            
            const statusState = competition.status?.type?.state || 'pre';
            const statusDesc = competition.status?.type?.description || 'TBD';

            const awayLogo = away.team?.logos?.[0]?.href || away.team?.logo || '';
            const homeLogo = home.team?.logos?.[0]?.href || home.team?.logo || '';
            const awayLocation = away.team?.location || '';
            const awayNameOnly = away.team?.name || away.team?.shortDisplayName || 'AWAY';
            const homeLocation = home.team?.location || '';
            const homeNameOnly = home.team?.name || home.team?.shortDisplayName || 'HOME';
            
            const awayScore = away.score || '0';
            const homeScore = home.score || '0';
            const awayRecord = away.record?.[0]?.summary || '0-0';
            const homeRecord = home.record?.[0]?.summary || '0-0';

            const { awayColor, homeColor } = resolveMatchupColors(away.team, home.team);
            let statusBadgeColor = 'text-zinc-400 bg-zinc-900 border-zinc-800';
            if (statusState === 'in') statusBadgeColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20 animate-pulse';
            if (statusState === 'pre') statusBadgeColor = 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20';

            let html = `
                <div class="relative w-full bg-zinc-950 p-4 rounded-2xl border border-zinc-800 shadow-inner overflow-hidden mb-4 flex flex-col">
                    <div class="relative z-10 flex justify-between items-center w-full">
                        <div class="flex flex-col items-center w-[33%]">
                            <div class="w-12 h-12 bg-zinc-900 rounded-full p-2 border shadow mb-1.5" style="border-color: ${awayColor};">
                                <img src="${awayLogo}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                            </div>
                            <div class="text-[9px] text-zinc-400 font-bold uppercase truncate w-full text-center">${awayLocation}</div>
                            <div class="text-xs font-black text-white uppercase truncate w-full text-center">${awayNameOnly}</div>
                            <div class="text-[9px] text-zinc-500 font-mono mt-1">${awayRecord}</div>
                        </div>

                        <div class="flex flex-col items-center justify-center w-[34%] space-y-1.5">
                            <div class="text-[8px] font-black uppercase tracking-widest px-2.5 py-0.5 rounded-full border ${statusBadgeColor}">${statusDesc}</div>
                            <div class="flex items-center justify-center gap-2 w-full">
                                <span class="text-3xl font-black text-white font-mono">${awayScore}</span>
                                <span class="text-zinc-700 font-black text-lg">-</span>
                                <span class="text-3xl font-black text-white font-mono">${homeScore}</span>
                            </div>
                        </div>

                        <div class="flex flex-col items-center w-[33%]">
                            <div class="w-12 h-12 bg-zinc-900 rounded-full p-2 border shadow mb-1.5" style="border-color: ${homeColor};">
                                <img src="${homeLogo}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                            </div>
                            <div class="text-[9px] text-zinc-400 font-bold uppercase truncate w-full text-center">${homeLocation}</div>
                            <div class="text-xs font-black text-white uppercase truncate w-full text-center">${homeNameOnly}</div>
                            <div class="text-[9px] text-zinc-500 font-mono mt-1">${homeRecord}</div>
                        </div>
                    </div>
                </div>
            `;

            if (statusState === 'pre') {
                html += `
                    <div class="space-y-3">
                        <h4 class="text-[11px] font-black uppercase tracking-widest text-zinc-300">📊 Matchup Comparison</h4>
                        <div class="bg-zinc-900/60 border border-zinc-800 p-3.5 rounded-2xl space-y-3">
                `;
                let hasComparisonData = false;
                let homeWinProb = data.predictor?.homeTeam?.gameProjection;
                let awayWinProb = data.predictor?.awayTeam?.gameProjection;
                
                if (homeWinProb) {
                    hasComparisonData = true;
                    let hp = parseFloat(homeWinProb);
                    let ap = awayWinProb ? parseFloat(awayWinProb) : 100 - hp;
                    html += generateComparisonBar('Win Probability', ap, hp, ap.toFixed(1) + '%', hp.toFixed(1) + '%', awayColor, homeColor);
                }

                let awayTeamStats = data.boxscore?.teams?.find(t => t.team?.id === away.team?.id)?.statistics || [];
                let homeTeamStats = data.boxscore?.teams?.find(t => t.team?.id === home.team?.id)?.statistics || [];

                if (awayTeamStats.length > 0 && homeTeamStats.length > 0) {
                    let statCount = 0;
                    for (let i = 0; i < awayTeamStats.length; i++) {
                        if (statCount >= 5) break;
                        let aStat = awayTeamStats[i];
                        let hStat = homeTeamStats.find(s => s.name === aStat.name);
                        if (hStat && aStat.displayValue && hStat.displayValue) {
                            let aVal = parseFloat(aStat.displayValue.replace(/,/g, ''));
                            let hVal = parseFloat(hStat.displayValue.replace(/,/g, ''));
                            if (!isNaN(aVal) && !isNaN(hVal)) {
                                hasComparisonData = true;
                                html += generateComparisonBar(aStat.label || aStat.name, aVal, hVal, aStat.displayValue, hStat.displayValue, awayColor, homeColor);
                                statCount++;
                            }
                        }
                    }
                }

                if (!hasComparisonData) {
                    html += `<div class="text-center text-[11px] text-zinc-600 py-4 uppercase tracking-wider">Comparison data unavailable prior to kickoff</div>`;
                }
                html += `</div></div>`;
            } else {
                html += `<div class="space-y-3">
                    <h4 class="text-[11px] font-black uppercase tracking-widest text-indigo-400">⚡ Scoring Summary</h4>`;
                if (data.scoringPlays && data.scoringPlays.length > 0) {
                    html += `<div class="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">`;
                    data.scoringPlays.forEach(play => {
                        html += `
                            <div class="bg-zinc-900/80 border border-zinc-800 text-xs p-2.5 rounded-xl flex justify-between items-center gap-2">
                                <div class="flex items-center gap-2">
                                    <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-1.5 py-0.5 rounded text-[9px] font-black whitespace-nowrap">Q${play.period?.number || ''}</span>
                                    <span class="text-zinc-300 text-[11px] leading-snug">${play.text}</span>
                                </div>
                                <span class="font-mono font-black text-cyan-400 text-xs shrink-0">${play.awayScore || '0'}-${play.homeScore || '0'}</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="bg-zinc-900/40 border border-dashed border-zinc-800 text-center text-[10px] text-zinc-600 py-6 rounded-xl uppercase tracking-wider">No scoring plays yet</div>`;
                }
                html += `</div>`;
            }

            content.innerHTML = html;
        }

        function closeGamecast() {
            document.getElementById('gamecast-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Initialize Load & Start Polling
        loadCalendarAndScores();
        setInterval(() => {
            if (!isInitialLoad && currentPage === 'scores') {
                fetchScoresForSelected();
            }
        }, 20000);
    </script>
</body>
</html>
